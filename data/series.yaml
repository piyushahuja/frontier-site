lead: On campus, weekly, through the Monsoon semester. Alumni ten to twenty years ahead return to tell the truth about the decisions they made.

body: >-
  Not placement talks: first-person reflection — what they got right, what they
  got wrong, what they wish they had known. Convened at IIT Delhi's Department of
  Computer Science with Prof. Naveen Garg, Head of Department and Shanti Swarup
  Bhatnagar laureate.

tracks:
  - Academia & Research
  - Research → Venture
  - Industry & Product
  - Capital & Investing
  - Public Service
  - Alternative Paths
