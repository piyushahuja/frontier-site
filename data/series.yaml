# The Talks section: intro lines, then the six tracks (name + body).
lead: >-
  On campus, weekly, through the Monsoon semester ('26). World class alumni return to share their wisdom.
body: >-  
 Convened at IIT Delhi's Department of Computer Science with Prof. Naveen Garg, Head of Department
tracks:
  - name: Academia & Research Labs
    body: >-
      Professors, lab directors, and research scientists — on the PhD decision,
      building a lab, publishing vs. impact, and academia vs. industry.
  - name: Research → Venture
    body: >-
      Scientists who turned research into deep-tech companies — when to leave
      the lab, co-founder dynamics, IP, and fundraising as a technical founder.
  - name: Industry & Product
    body: >-
      Engineers and product leaders at big tech and growth-stage companies —
      research vs. product, career growth, and the learning-vs-compensation tradeoff.
  - name: Capital & Investing
    body: >-
      VCs, angels, and operators-turned-investors — how venture capital works,
      evaluating deep-tech deals, and what founders get wrong.
  - name: Public Service & Impact
    body: >-
      Government tech at Aadhaar scale, NGOs, and policy — why this path, working
      within institutions, and career sustainability.
  - name: Alternative Paths
    body: >-
      Builders of new institutions — neo-incubators, independent labs, open-source
      leaders — on why existing institutions fail and how to design better ones.
