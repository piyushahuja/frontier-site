# The Projects section: prose paragraphs, then the timeline ladder.
# In prose, **double asterisks** render bold (used for project names).
prose:
  - >-
    Projects are about real problems with real stakes, scoped so a first result arrives within a semester. Three are live today:
    
    * In EMG → Force, an undergraduate beat Meta's published EMG-to-pose
    benchmark, then ran a scaling-law study alongside frontier researchers.
    
    * Indic Scaling Laws draws the empirical curves for how model quality
    scales across Indian languages, the measurements nobody has published yet.
    
    * Multi-Node Compute closes the infrastructure gap, carrying students from
    single shared GPUs to multi-node clusters that can actually hold a frontier
    run, with alumni at NVIDIA and Meta.
  - >-
    The next wave reaches past language models into the wider deep-tech frontier.
    Protein Design for Neglected Diseases puts open structure-prediction and
    binder-design models to work on targets global pharma ignores: dengue, TB,
    snakebite venom. ML Potentials for Solid-State Batteries screens
    electrolyte and cathode candidates with learned interatomic potentials,
    compressing years of wet-lab search into weeks of compute. Each is small
    enough for a team of undergraduates to begin, and large enough to matter.

timeline:
  title: Timeline — from project to funded company
  intro: >-
    One straight line, six years long: from the first contact with real research
    to a company of genuine global consequence.
  # Set dest: true on the final node (rendered in accent red).
  steps:
    - year: Year 2
      title: Exposure
      desc: First contact with real research and people a few steps ahead.
    - year: Year 3
      title: Projects
      desc: Real work — beat a published benchmark, join a live problem.
    - year: Year 4
      title: Publish
      desc: Work that stands at the frontier, in the open.
    - year: +1–2 yrs
      title: Found
      desc: A company within a year or two of graduating, with backing.
    - year: Then
      title: Frontier
      desc: In time, one of genuine global consequence.
      dest: true
