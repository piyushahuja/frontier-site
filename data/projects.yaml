projects:
  - name: EMG → Force
    body: >-
      Three undergraduates beat Meta's published EMG-to-pose benchmark, then ran
      a scaling-law study with frontier researchers. Toward a first-author
      NeurIPS paper from the department.
  - name: Indic Scaling Laws
    body: >-
      How model quality scales for Indian languages — the empirical curves
      nobody has drawn yet.
  - name: Compute at IIT
    body: >-
      Closing the infrastructure gap — from shared GPUs to real training
      clusters — with alumni at NVIDIA and Meta.

timeline:
  title: Timeline — a six-year ladder
  intro: >-
    From lecture hall to frontier lab: exposure in year two, real research by
    year three, published work at the frontier by year four, companies within a
    year or two of graduating — and, in time, one of genuine global consequence.
  steps:
    - year: Year 2
      label: Exposure
    - year: Year 3
      label: Projects
    - year: Year 4
      label: Publish
    - year: +1–2 yrs
      label: Found
    - year: Then
      label: Frontier
