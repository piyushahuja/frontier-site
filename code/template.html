<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ROBOTS}}
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f7f4ee; --ink:#161412; --accent:#7c1d1d; --muted:#6f665c; --rule:#d3c9b8; --rule-soft:#e7dfcf; --divider:#2b2521; --divider-soft:#9a8b73; --label:#8a8178; }
  /* PRIMITIVE · type scale (parsimonized) */
  :root{
    --t-label:12px;  /* labels, eyebrows, subheads, captions, tiny meta */
    --t-small:13px;  /* nav, timeline desc, fine print */
    --t-meta:14px;   /* attributions, track, tooltip name */
    --t-sm:15px;     /* agenda speaker line, card body, supporter link */
    --t-base:16.5px; /* body */
    --t-lede:17.5px; /* hero lede */
    --t-h4:19px;     /* logo mark, speaker name */
    --t-h3:21px;     /* serif headings, lead-serif, timeline title */
    --t-quote:25px;  /* pull quote */
    --t-display:34px;/* big agenda date, mobile h1 */
  }
  *{box-sizing:border-box}
  html{overflow-x:clip}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Libre Franklin",sans-serif;font-size:var(--t-base);line-height:1.6;overflow-x:clip}
  .wrap{max-width:800px;margin:0 auto;padding:0 40px}
  a{color:var(--accent)}
  .serif{font-family:"Source Serif 4",Georgia,serif}
  nav{border-bottom:2px solid var(--divider);position:sticky;top:0;background:var(--paper);z-index:10}
  nav .wrap{display:flex;justify-content:center;align-items:center;height:64px;flex-wrap:wrap}
  .mark{font-weight:700;font-size:var(--t-h4);letter-spacing:.02em;text-transform:uppercase}
  .mark .sq{color:var(--accent)}
  .navlinks{margin-left:0;display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap}
  .navlinks a{text-decoration:none;color:var(--ink);font-size:var(--t-small);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
  .navlinks a:hover{color:var(--accent)}
  header.hero{border-bottom:1px solid var(--divider-soft);padding:60px 0 52px}
  header.hero .wrap{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
  h1{font-family:"Source Serif 4",serif;font-size:clamp(38px,4.4vw,56px);line-height:0.98;font-weight:500;letter-spacing:-.015em;margin:0;max-width:none}
  .lede{font-size:var(--t-lede);color:#3a352f;margin:0;max-width:none;line-height:1.68}
  /* PRIMITIVE · section + label */
  section{border-bottom:1px solid var(--divider-soft);padding:46px 0;scroll-margin-top:66px}
  .label{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.18em;font-weight:600;color:var(--label);margin-bottom:22px}
  .eyebrow{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.2em;color:var(--label);font-weight:600;margin-bottom:6px}
  /* PRIMITIVE · prose */
  .lead-serif{font-family:"Source Serif 4",serif;font-size:var(--t-h3);line-height:1.42;max-width:none;margin:0 0 20px}
  .prose{max-width:none}
  .prose p{margin:0 0 1.1em}
  .prose ul{margin:.2em 0 1.1em;padding-left:1.3em;list-style:disc}
  .prose li{margin-bottom:.55em;line-height:1.6}
  .prose.wide{max-width:none}
  em{font-style:italic;color:inherit}
  .pull{padding:24px 0 4px;margin:32px 0 36px;max-width:none}
  .pull .s{font-family:"Source Serif 4",serif;font-size:var(--t-quote);line-height:1.24;letter-spacing:-.01em;font-style:italic}
  .pull .t{font-size:var(--t-meta);color:var(--muted);margin-top:13px;font-style:normal}
  .subhead{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--label);margin:34px 0 0}
  .subhead.schead{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  /* schedule · date-block agenda */
  .agenda{max-width:none;margin-top:14px}
  .agenda .ev{display:grid;grid-template-columns:88px 1fr 150px;gap:28px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule-soft)}
  .agenda .trk{font-size:var(--t-meta);color:var(--muted);text-align:right;line-height:1.4;align-self:center}
  .agenda .ev:last-child{border-bottom:0}
  .agenda .cal{line-height:1}
  .agenda .cal .day{font-family:"Source Serif 4",serif;font-size:var(--t-display);font-weight:500;color:var(--ink);letter-spacing:-.01em}
  .agenda .cal .mon{display:block;font-size:var(--t-label);text-transform:uppercase;letter-spacing:.1em;color:var(--label);font-weight:600;margin-top:6px}
  .agenda .cal.nodate .day{font-size:var(--t-h3)}
  .agenda .who{font-size:var(--t-sm);color:#4a443c;line-height:1.5}
  .agenda .who b{display:block;font-size:var(--t-h4);font-weight:600;color:var(--ink);margin-bottom:2px}
  .agenda .ev.tbd{opacity:.5}
  /* PRIMITIVE · card (projects) */
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;margin-top:6px}
  .cards .p{border-top:1px solid var(--rule);padding-top:16px}
  .cards h3{font-family:"Source Serif 4",serif;font-weight:500;font-size:var(--t-h3);margin:0 0 10px}
  .cards p{font-size:var(--t-sm);color:#4a443c;margin:0;line-height:1.55}
  /* PRIMITIVE · supporter bubbles (canvas fills the whole black band) */
  .supporter-rain{position:relative;border:0;max-width:800px;margin:0 auto;padding:34px 40px;min-height:240px}
  .supporter-rain .sr-stage{position:absolute;inset:0}
  .supporter-rain canvas{display:block;width:100%;height:100%}
  .supporter-rain .sr-tip{position:absolute;pointer-events:none;white-space:nowrap;background:var(--paper);color:var(--ink);border-radius:5px;padding:8px 11px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:opacity .15s ease,transform .15s ease}
  .supporter-rain .sr-tip[hidden]{display:block;opacity:0;transform:translateY(6px)}
  .supporter-rain .sr-tip b{display:block;font-size:var(--t-meta);font-weight:600;line-height:1.2}
  .supporter-rain .sr-tip span{display:block;font-size:var(--t-label);color:var(--muted);margin-top:2px}
  .supporter-rain .sr-list{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){
    .supporter-rain{min-height:0}
    .supporter-rain .sr-stage{display:none}
    .supporter-rain .sr-list{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:14px 26px}
    .supporter-rain .sr-list li{line-height:1.35}
    .supporter-rain .sr-list a{color:var(--paper);text-decoration:none;font-weight:600;font-size:var(--t-sm)}
    .supporter-rain .sr-list span{display:block;color:#b9ad9c;font-weight:400;font-size:var(--t-small)}
  }
  footer{background:var(--ink);color:var(--paper);padding:0;position:relative;overflow:hidden}
  footer .label{position:relative;z-index:2;color:#b9ad9c;margin-bottom:14px;pointer-events:none}
  footer a{color:#e0a0a0}
  /* lifecycle timeline (project -> funded company) */
  .flow{margin:26px 0 40px;max-width:none}
  .flow .track{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
  .flow .track::before{content:"";position:absolute;left:7px;right:34px;top:13px;height:2px;background:var(--ink)}
  .flow .track::after{content:"";position:absolute;right:22px;top:7px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--ink)}
  .flow .node{position:relative;padding:34px 22px 0 0}
  .flow .node::before{content:"";position:absolute;top:6px;left:0;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);z-index:1}
  .flow .node.dest::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,29,29,.14)}
  .flow .yr{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.11em;color:var(--label);font-weight:600;margin-bottom:5px}
  .flow .t{font-family:"Source Serif 4",serif;font-size:var(--t-h3);line-height:1.12;font-weight:500}
  .flow .d{font-size:var(--t-small);color:var(--muted);margin-top:6px;line-height:1.4;max-width:19ch}
  .flow .node.dest .t{color:var(--accent)}
  @media(max-width:760px){
    header.hero .wrap{gap:16px} h1{font-size:var(--t-display)}
    .prose,.prose.wide{max-width:none}
    .supporter-rain{min-height:200px;padding:28px 24px}
    .cards{grid-template-columns:1fr;gap:0}
    .cards .p{border-top:1px solid var(--rule-soft);padding:18px 0}
    .cards .p:first-child{border-top:1px solid var(--rule)}
    /* schedule: track drops under the name */
    .subhead.schead .thead{display:none}
    .agenda .ev{grid-template-columns:64px 1fr;gap:16px}
    .agenda .trk{grid-column:2;text-align:left;margin-top:2px}
    /* timeline -> vertical line */
    .flow .track{grid-template-columns:1fr;row-gap:0}
    .flow .track::before{left:7px;right:auto;top:10px;bottom:24px;height:auto;width:2px}
    .flow .track::after{display:none}
    .flow .node{padding:2px 0 22px 40px}
    .flow .node::before{top:2px}
    .flow .d{max-width:none}
  }
</style>
</head>
<body>

<!-- Password Gate -->
<div id="pw-gate" style="position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center">
  <form id="pw-form" style="text-align:center;font-family:'Libre Franklin',sans-serif">
    <div style="font-size:var(--t-label);letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:24px">{{GATE_LABEL}}</div>
    <input id="pw-input" type="password" placeholder="Enter password"
      style="font-size:var(--t-base);padding:10px 16px;border:2px solid var(--ink);background:var(--paper);font-family:inherit;width:240px;outline:none">
    <br>
    <button type="submit"
      style="margin-top:12px;padding:8px 28px;font-size:var(--t-small);text-transform:uppercase;letter-spacing:.1em;font-weight:600;background:var(--ink);color:var(--paper);border:none;cursor:pointer;font-family:inherit">Enter</button>
    <div id="pw-error" style="color:var(--accent);font-size:var(--t-small);margin-top:12px;visibility:hidden">Incorrect password</div>
  </form>
</div>
<script>
(function(){
  // Don't let the browser restore a prior scroll position — always start at the top.
  if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }
  var gate = document.getElementById('pw-gate');
  var input = document.getElementById('pw-input');
  function dismiss(){
    gate.style.display = 'none';
    window.scrollTo(0, 0);   // land at the top of the page, never mid-section
  }
  if(sessionStorage.getItem('pw-ok')==='1'){
    dismiss();
  } else {
    input.focus({preventScroll:true});   // focus the field without scrolling the page under the gate
  }
  document.getElementById('pw-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(input.value === '{{PASSWORD}}'){
      sessionStorage.setItem('pw-ok','1');
      dismiss();
    } else {
      document.getElementById('pw-error').style.visibility='visible';
      input.value='';
    }
  });

  // Randomise project order on each load (Fisher-Yates).
  var grid = document.querySelector('.cards');
  if(grid){
    var cards = Array.prototype.slice.call(grid.children);
    for(var i = cards.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
    }
    cards.forEach(function(c){ grid.appendChild(c); });
  }
})();
</script>

<nav><div class="wrap">
  <div class="navlinks">
{{NAV}}
  </div>
</div></nav>

<header class="hero"><div class="wrap">
  <div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{HERO_HEADLINE}}</h1>
  </div>
  <p class="lede">{{HERO_LEDE}}</p>
</div></header>

<section id="manifesto"><div class="wrap">
{{MANIFESTO}}
</div></section>

<section id="series"><div class="wrap">
  <div class="label">Talks</div>
  <p class="lead-serif">{{SERIES_LEAD}}</p>
  <p class="prose wide">{{SERIES_BODY}}</p>
  <div class="subhead schead"><span>Schedule</span><span class="thead">Track</span></div>
  <div class="agenda">
{{SPEAKERS}}
  </div>
</div></section>

<section id="projects"><div class="wrap">
  <div class="label">Projects</div>
  <div class="prose">
{{PROJECTS_LEAD}}
  </div>
  <div class="flow">
    <div class="track">
{{TIMELINE_STEPS}}
    </div>
  </div>
  <div class="prose">
{{PROJECTS_PROSE}}
  </div>
</div></section>

<footer>
  <section class="supporter-rain" aria-label="Our supporters">
    <div class="sr-stage"><canvas></canvas></div>
    <div class="sr-tip" hidden></div>
    <!-- Real, crawlable supporter list: read by screen readers, shown
         visually when the user prefers reduced motion. -->
    <ul class="sr-list"></ul>
  </section>
</footer>
<script>
/* Supporters — paper-coloured droplets sit at fixed pixels that spell the word
   SUPPORTERS. Each droplet only twinkles in and out on the spot; nothing drifts.
   Hover (or tap) one and it bursts into a name-carrying cloud, then reforms. */
(function () {
  var CONFIG = {
    water: '#f7f4ee',   /* drops, splashes, sprinkles — the page's paper colour */
    px: 4,              /* pixel cell size */
    step: 8,            /* spacing of the droplet grid that forms the word */
    word: 'SUPPORTERS',
    gravity: 0.05
  };
  var SUPPORTERS = [
{{SUPPORTERS}}
  ];

  var root = document.querySelector('.supporter-rain');
  if (!root) return;
  var stage = root.querySelector('.sr-stage');
  var cv = root.querySelector('canvas');
  var ctx = cv.getContext('2d');
  var tip = root.querySelector('.sr-tip');
  var list = root.querySelector('.sr-list');

  SUPPORTERS.forEach(function (s) {
    var li = document.createElement('li'), a = document.createElement('a'), sp = document.createElement('span');
    a.href = s.url; a.textContent = s.name; a.target = '_blank'; a.rel = 'noopener';
    sp.textContent = s.aff;
    li.appendChild(a); li.appendChild(sp); list.appendChild(li);
  });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* Touch devices have no hover and open external links jarringly, so there the
     droplets are chunkier and a tap only reveals the name — never navigates. */
  var COARSE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var PX = COARSE ? 5 : CONFIG.px, STEP = CONFIG.step, G = CONFIG.gravity;
  var FONT = '800 %px "Helvetica Neue", Arial, sans-serif';
  var W, H, cells = [];

  /* Rasterise the word once to an offscreen canvas and keep every grid cell that
     lands on a glyph — those anchors are the droplet positions. They never move;
     a droplet just fades in and out at its fixed spot (or bursts on hover). */
  function buildCells() {
    cells = [];
    if (!W || !H) return;
    var tc = document.createElement('canvas');
    tc.width = W; tc.height = H;
    var tx = tc.getContext('2d');
    tx.font = FONT.replace('%', 100);
    var wide = tx.measureText(CONFIG.word).width || W;
    var fs = Math.min(100 * (W * 0.9) / wide, H * 0.6);
    tx.font = FONT.replace('%', fs);
    tx.textAlign = 'center'; tx.textBaseline = 'middle';
    tx.fillStyle = '#fff';
    tx.fillText(CONFIG.word, W / 2, H / 2);
    var data = tx.getImageData(0, 0, W, H).data;
    for (var y = STEP; y < H - STEP; y += STEP) {
      for (var x = 0; x < W; x += STEP) {
        if (data[(y * W + x) * 4 + 3] > 130) {
          cells.push({
            x: Math.round(x / PX) * PX,
            y: Math.round(y / PX) * PX,
            phase: Math.random() * Math.PI * 2,
            spd: 0.005 + Math.random() * 0.008,
            cloud: null, hold: 0, s: null, cool: 0
          });
        }
      }
    }
  }

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    buildCells();
  }
  resize();
  window.addEventListener('resize', resize);

  var parts = [];
  var mouse = { x: -999, y: -999 }, hovered = null, pinned = null, T = 0;

  /* Names are handed out in a pre-shuffled order as droplets burst, so a name
     only recurs once every other supporter has been shown. A droplet carries no
     name until the moment it is caught. */
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var order = shuffle(SUPPORTERS.map(function (_, i) { return i; })), qi = 0;
  function nextSupporter() {
    var s = SUPPORTERS[order[qi]];
    if (++qi >= order.length) {                 /* full pass done — reshuffle for the next */
      var last = order[order.length - 1];
      shuffle(order);
      if (order.length > 1 && order[0] === last) { var t = order[0]; order[0] = order[1]; order[1] = t; }
      qi = 0;
    }
    return s;
  }

  /* A resting droplet's opacity: eases fully on, holds lit for most of the
     cycle, dips briefly to nothing, then returns — so at any moment most of the
     word is present and only a few pixels are blinking out of the shape. */
  function twinkle(c) {
    var v = 0.5 + 0.5 * Math.sin(T * c.spd + c.phase);
    return Math.max(0, Math.min(1, (v - 0.06) / 0.24));
  }

  function ignite(c) {
    if (!c.s) c.s = nextSupporter();
    c.cloud = [];
    for (var k = 0; k < 16; k++) {
      var a = (k / 16) * Math.PI * 2 + Math.random() * 0.5;
      var sp = 1.1 + Math.random() * 1.9;
      c.cloud.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1 });
    }
    c.hold = 0;
  }

  function release(c) {
    c.cloud.forEach(function (p) {
      parts.push({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, life: 1, decay: 0.03 + Math.random() * 0.025 });
    });
    c.cloud = null; c.s = null; c.hold = 0;
    c.cool = 80 + Math.floor(Math.random() * 70);   /* stay dark a beat, then reform */
  }

  function loop() {
    T++;
    ctx.clearRect(0, 0, W, H);

    /* nearest catchable droplet under the cursor; a held one keeps a wider grip */
    hovered = null;
    var best = Infinity;
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (c.cool > 0 && !c.cloud) continue;
      var rad = c.cloud ? 26 : 13;
      var dx = mouse.x - c.x, dy = mouse.y - c.y;
      if (Math.abs(dx) < rad && Math.abs(dy) < rad) {
        var dd = dx * dx + dy * dy;
        if (dd < best) { best = dd; hovered = c; }
      }
    }
    /* Touch has no cursor to track, so a tap pins a droplet: it stays held
       (frozen, tooltip up) until tapped again to open or dismissed. */
    if (pinned) {
      if (cells.indexOf(pinned) === -1) pinned = null; else hovered = pinned;
    }

    for (var i2 = 0; i2 < cells.length; i2++) {
      var d = cells[i2];
      if (hovered === d) {
        if (!d.cloud) ignite(d);
        d.hold = Math.min(d.hold + 0.09, 1);
        var ts = Math.max(0.04, 1 - d.hold);
        ctx.globalAlpha = 1;
        ctx.fillStyle = CONFIG.water;
        d.cloud.forEach(function (p) {
          p.x += p.vx * ts; p.y += p.vy * ts; p.vy += G * 0.4 * ts;
          var jx = Math.sin(T * 0.1 + p.vx * 7) * 0.4;
          ctx.fillRect(Math.round((p.x + jx) / PX) * PX, Math.round(p.y / PX) * PX, PX - 0.5, PX - 0.5);
        });
        continue;
      }
      if (d.cloud) { release(d); continue; }   /* was held, now let go — burst it */
      if (d.cool > 0) { d.cool--; continue; }  /* burnt spot, still dark — reforming */
      var al = twinkle(d);
      if (al <= 0.01) continue;
      ctx.globalAlpha = al;
      ctx.fillStyle = CONFIG.water;
      ctx.fillRect(d.x, d.y, PX - 0.5, PX - 0.5);
    }

    ctx.fillStyle = CONFIG.water;
    for (var i3 = parts.length - 1; i3 >= 0; i3--) {
      var p = parts[i3];
      p.x += p.vx; p.y += p.vy; p.vy += 0.09; p.vx *= 0.99; p.life -= p.decay;
      if (p.y > H || p.y < 0) { p.life -= 0.25; } /* fade once it leaves the band, never pile into a line */
      if (p.life <= 0) { parts.splice(i3, 1); continue; }
      ctx.globalAlpha = Math.min(p.life * 1.5, 1);
      ctx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, PX - 1, PX - 1);
    }
    ctx.globalAlpha = 1;

    if (hovered && hovered.s) {
      stage.style.cursor = 'pointer';
      if (tip.dataset.for !== hovered.s.name) {
        tip.innerHTML = '';
        var b = document.createElement('b'); b.textContent = hovered.s.name;
        tip.appendChild(b);
        if (!COARSE) {   /* on touch, show the name alone; desktop keeps the affiliation line */
          var sp2 = document.createElement('span'); sp2.textContent = hovered.s.aff;
          tip.appendChild(sp2);
        }
        tip.dataset.for = hovered.s.name;
      }
      tip.hidden = false;
      /* On touch the card is a tap-to-dismiss target; on desktop it must stay
         click-through so it never blocks the hovered droplet. */
      tip.style.pointerEvents = pinned ? 'auto' : 'none';
      tip.style.cursor = (pinned && !COARSE) ? 'pointer' : 'default';
      var tw = tip.offsetWidth || 160, th = tip.offsetHeight || 40;
      tip.style.left = Math.max(6, Math.min(hovered.x - tw / 2, W - tw - 6)) + 'px';
      tip.style.top = Math.max(6, hovered.y - th - 14) + 'px';
    } else {
      stage.style.cursor = 'default';
      tip.hidden = true;
      tip.style.pointerEvents = 'none';
      tip.dataset.for = '';
    }
    requestAnimationFrame(loop);
  }
  loop();

  function setMouse(cx, cy) {
    var r = stage.getBoundingClientRect();
    mouse.x = cx - r.left; mouse.y = cy - r.top;
  }
  stage.addEventListener('mousemove', function (e) { setMouse(e.clientX, e.clientY); });
  stage.addEventListener('mouseleave', function () { mouse.x = -999; mouse.y = -999; });
  stage.addEventListener('click', function () {
    if (!COARSE && hovered && hovered.s) window.open(hovered.s.url, '_blank', 'noopener');
  });
  /* Touch: a tap grabs the nearest droplet within a forgiving radius and pins it
     (frozen, name card up). The link opens only by tapping that card — tapping
     the pixel again, or empty space, never opens it, it just holds or dismisses. */
  function pickNear(px, py) {
    var best = null, bestD = 40 * 40;
    cells.forEach(function (c) {
      if (c.cool > 0 && !c.cloud) return;
      var dx = px - c.x, dy = py - c.y, dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = c; }
    });
    return best;
  }
  stage.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0], r = stage.getBoundingClientRect();
    var hit = pickNear(t.clientX - r.left, t.clientY - r.top);
    if (hit || pinned) e.preventDefault();  /* grabbing or dismissing — not a page scroll */
    pinned = hit || null;                   /* hold this droplet; any previously pinned one bursts next frame */
  }, { passive: false });
  tip.addEventListener('touchstart', function (e) {
    if (!pinned) return;
    e.preventDefault();
    if (COARSE) { pinned = null; }          /* the card only shows the name — tap it to dismiss, never navigate */
    else if (pinned.s) { window.open(pinned.s.url, '_blank', 'noopener'); }
  }, { passive: false });
})();
</script>
</body>
</html>
